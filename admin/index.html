<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Meeting requests — WeWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1F6B45; --accent:#2E8B57; --deep:#0C2A1C; --panel:#123123;
  --ink:#FFFFFF; --dim:rgba(255,255,255,.6); --line:rgba(255,255,255,.13);
  --display:'Bebas Neue',Impact,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --sans:'DM Sans',system-ui,sans-serif; --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
a{color:inherit;}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,44px);}

.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
.head h1{font-family:var(--display);font-size:clamp(26px,4vw,40px);letter-spacing:.03em;text-transform:uppercase;}
.head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.tools{display:flex;gap:8px;}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:10px 18px;cursor:pointer;transition:border-color .25s,background-color .25s;
}
.btn:hover{border-color:var(--accent);background:rgba(46,139,87,.16);}
.btn.solid{background:var(--accent);border-color:var(--accent);}

/* token gate */
.gate{max-width:420px;margin:14vh auto;text-align:center;}
.gate h2{font-family:var(--display);font-size:30px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:10px;}
.gate p{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:22px;}
.inp{
  width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
}
.inp:focus{outline:none;border-color:var(--accent);}
.gate .btn{margin-top:12px;width:100%;justify-content:center;}
.err{color:#FF9C8A;font-family:var(--mono);font-size:11px;margin-top:12px;min-height:16px;}

/* filters */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.tab{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;cursor:pointer;transition:all .25s;
}
.tab:hover{color:var(--ink);border-color:rgba(255,255,255,.3);}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab b{font-weight:400;opacity:.7;margin-left:5px;}

/* rows */
.list{display:flex;flex-direction:column;gap:12px;}
.row{
  background:var(--panel);border:1px solid var(--line);border-radius:15px;
  padding:clamp(16px,2vw,22px);
}
.row.s-booked{border-color:rgba(46,139,87,.5);}
.row.s-archived{opacity:.55;}
.r-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline;}
.r-name{font-family:var(--display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;}
.r-when{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em;}
.r-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0;}
.r-meta a,.r-meta span{font-family:var(--mono);font-size:11.5px;color:var(--dim);word-break:break-all;}
.r-meta a:hover{color:var(--accent);}
.r-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink);
  border:1px solid rgba(46,139,87,.45);background:rgba(46,139,87,.14);
  border-radius:999px;padding:5px 11px;
}
.r-msg{font-size:14px;line-height:1.6;color:var(--dim);border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px;}
.r-date{
  display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--ink);background:rgba(255,255,255,.07);border-radius:8px;padding:6px 11px;margin-bottom:14px;
}
.r-foot{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.sel{
  font-family:var(--mono);font-size:10.5px;color:var(--ink);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;
}
.sel option{background:var(--panel);}
.note{
  flex:1;min-width:200px;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
}
.note:focus{outline:none;border-color:var(--accent);}
.saved{font-family:var(--mono);font-size:9.5px;color:var(--accent);opacity:0;transition:opacity .3s;}
.saved.on{opacity:1;}

.empty{text-align:center;padding:60px 20px;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.1em;}
@media (max-width:600px){ .r-foot{flex-direction:column;align-items:stretch;} .note{min-width:0;} }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>Meeting requests</h2>
  <p>Enter the admin token to view submissions.</p>
  <input class="inp" id="tok" type="password" placeholder="Admin token" autocomplete="current-password">
  <button class="btn solid" id="tokGo">Unlock</button>
  <p class="err" id="gateErr"></p>
</div>

<div class="wrap" id="app" hidden>
  <div class="head">
    <div>
      <p class="sub">WeWave</p>
      <h1>Meeting requests</h1>
    </div>
    <div class="tools">
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="logout">Lock</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
