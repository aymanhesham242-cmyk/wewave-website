<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>WeWave — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Dashboard chrome. Borrows the studio's greens and mono type, but the layout
   is built for data density rather than the site's scroll choreography. */
:root{
  --bg:#0B0F0D; --panel:#111714; --panel-2:#161E1A; --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --ink:#F2F7F4; --dim:rgba(242,247,244,.60); --faint:rgba(242,247,244,.38);
  --glow:#2E8B57; --glow-2:#35C97A; --warn:#E0A33E; --bad:#D4685B;
  --mono:'DM Mono',ui-monospace,monospace; --sans:'DM Sans',system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;}
.mono{font-family:var(--mono);}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;padding:24px;}
/* `hidden` only wins if nothing else sets display — same guard as .mreq in css/style.css */
.gate[hidden],.shell[hidden]{display:none;}
.gate-card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;}
.gate h1{font-size:18px;margin-bottom:6px;}
.gate p{color:var(--dim);font-size:13px;margin:0 0 18px;}
.inp{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;color:var(--ink);font-family:var(--mono);font-size:13px;outline:none;}
.inp:focus{border-color:var(--glow);}
.btn{background:var(--glow-2);color:#06120B;border-radius:8px;padding:11px 18px;font-weight:700;
  font-size:13px;width:100%;margin-top:12px;transition:filter .2s;}
.btn:hover{filter:brightness(1.08);}
.btn.sm{width:auto;padding:7px 14px;font-size:12px;margin:0;}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink);}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px;}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh;}
.side{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;}
.brandline{display:flex;align-items:center;gap:9px;padding:0 8px 18px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--glow-2);box-shadow:0 0 12px var(--glow-2);}
.brandline b{font-size:14px;letter-spacing:.02em;}
.side nav{display:flex;flex-direction:column;gap:2px;}
.side nav button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  color:var(--dim);font-size:13px;text-align:left;transition:background .15s,color .15s;}
.side nav button:hover{background:var(--panel);color:var(--ink);}
.side nav button.on{background:var(--panel-2);color:var(--ink);font-weight:500;}
.side nav button i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;}
.side nav button.on i{background:var(--glow-2);opacity:1;}
.side-foot{margin-top:18px;padding:0 8px;color:var(--faint);font-size:11px;font-family:var(--mono);}

.main{padding:22px 26px 60px;min-width:0;}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.top h2{font-size:20px;margin-right:auto;}
.ranges{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;}
.ranges button{padding:6px 11px;border-radius:6px;font-size:12px;color:var(--dim);}
.ranges button.on{background:var(--panel-2);color:var(--ink);}
.pill-live{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;font-size:12px;font-family:var(--mono);}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--glow-2);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

/* ---------- blocks ---------- */
.grid{display:grid;gap:12px;}
.kpis{grid-template-columns:repeat(4,1fr);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;}
.card h3{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.kpi .s{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:3px;}
.two{grid-template-columns:1fr 1fr;}
.three{grid-template-columns:2fr 1fr;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
  font-weight:500;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--panel-2);}
.num{font-family:var(--mono);text-align:right;white-space:nowrap;}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--panel-2);
  border:1px solid var(--line);font-size:11px;font-family:var(--mono);color:var(--dim);}

.bar{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--glow-2);}
.empty{padding:34px 12px;text-align:center;color:var(--faint);font-size:13px;}
.loading{padding:34px 12px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}

/* funnel */
.fun{display:flex;flex-direction:column;gap:9px;}
.fun-row{display:grid;grid-template-columns:150px 1fr 108px;gap:12px;align-items:center;}
.fun-row .lbl{font-size:13px;color:var(--dim);}
.fun-track{height:30px;border-radius:7px;background:var(--panel-2);overflow:hidden;}
.fun-track i{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--glow-2));}
.fun-row .n{font-family:var(--mono);font-size:12px;text-align:right;}
.fun-row .n span{color:var(--faint);}

/* heatmap */
.hm-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:8px 11px;font-size:12px;font-family:var(--mono);outline:none;}
select:focus{border-color:var(--glow);}
.hm-stage{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#000;}
.hm-stage iframe{display:block;width:100%;border:0;background:#0B120E;}
.hm-stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.hm-legend{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:11px;
  font-family:var(--mono);color:var(--faint);}
.hm-scale{height:9px;width:190px;border-radius:999px;
  background:linear-gradient(90deg,rgba(0,90,255,.65),rgba(0,230,180,.75),rgba(240,220,60,.85),rgba(245,120,40,.9),rgba(230,40,40,.95));}
.hm-note{color:var(--faint);font-size:12px;margin-top:8px;}

/* sessions */
.timeline{display:flex;flex-direction:column;gap:0;}
.tl{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.tl .t{font-family:var(--mono);font-size:11px;color:var(--faint);}
.tl .e b{font-size:13px;font-weight:500;}
.tl .e small{display:block;color:var(--dim);font-size:12px;}
.back{font-size:12px;color:var(--dim);margin-bottom:12px;display:inline-block;}
.back:hover{color:var(--ink);}

/* feed */
.feed{display:flex;flex-direction:column;gap:0;max-height:330px;overflow:auto;}
.feed-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;}
.feed-row .tm{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 52px;}

svg .ln{fill:none;stroke:var(--glow-2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
svg .ar{fill:url(#g);}
svg .gl{stroke:rgba(255,255,255,.07);stroke-width:1;}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,1fr);} .three,.two{grid-template-columns:1fr;} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);}
  .side nav{flex-direction:row;flex-wrap:wrap;}
  .main{padding:18px 14px 50px;}
  .fun-row{grid-template-columns:110px 1fr;} .fun-row .n{grid-column:2;text-align:left;}
}
@media (max-width:560px){ .kpis{grid-template-columns:1fr 1fr;} .top h2{font-size:17px;} }
</style>
</head>
<body>

<!-- token gate; the page itself holds no data -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>WeWave Analytics</h1>
    <p>Enter the admin token to view visitor data.</p>
    <input class="inp" id="tok" type="password" placeholder="Admin token" autocomplete="current-password">
    <button class="btn" id="go">Unlock</button>
    <p class="err" id="gateErr"></p>
  </div>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brandline"><span class="dot"></span><b>Analytics</b></div>
    <nav id="nav">
      <button data-v="overview" class="on"><i></i>Overview</button>
      <button data-v="heatmaps"><i></i>Heatmaps</button>
      <button data-v="sessions"><i></i>Sessions</button>
      <button data-v="pages"><i></i>Pages</button>
      <button data-v="conversions"><i></i>Conversions</button>
      <button data-v="sources"><i></i>Traffic sources</button>
      <button data-v="devices"><i></i>Devices</button>
      <button data-v="events"><i></i>Events</button>
      <button data-v="settings"><i></i>Settings</button>
    </nav>
    <div class="side-foot">
      <div id="modeLabel">live data</div>
      <div style="margin-top:8px"><a href="/admin" style="color:var(--dim)">&larr; Meetings</a></div>
      <div style="margin-top:4px"><button id="lock" style="color:var(--faint);font-size:11px;font-family:var(--mono)">Lock</button></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <h2 id="title">Overview</h2>
      <div class="ranges" id="ranges">
        <button data-d="1">Today</button>
        <button data-d="2">48h</button>
        <button data-d="7" class="on">7d</button>
        <button data-d="30">30d</button>
        <button data-d="90">90d</button>
      </div>
      <div class="pill-live"><span class="pulse"></span><span id="activeNow">–</span> active</div>
    </div>
    <div id="view"><div class="loading">Loading…</div></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
